services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: cuantai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your shell}
      POSTGRES_DB: cuantai
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - cuantai-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cuantai -d cuantai']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  cuantai-postgres:
